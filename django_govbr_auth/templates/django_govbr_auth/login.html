<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar com Gov.br</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f8f9fa;
        }
        .login-card {
            background: #ffffff;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .govbr-btn {
            background-color: #1351b4;
            color: #ffffff;
            border: none;
            padding: 0.85rem 1.75rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.2s ease;
        }
        .govbr-btn:hover {
            background-color: #0c326f;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Autenticação Gov.br</h2>
        <p>Clique no botão abaixo para prosseguir com o seu login único do Governo Federal.</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="govbr-btn">Entrar com gov.br</button>
        </form>
    </div>
</body>
</html>
