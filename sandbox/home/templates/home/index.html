<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sandbox django-auth-govbr</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 2rem; background: #f8f9fa; }
        .card { background: white; padding: 2rem; border-radius: 8px; max-width: 500px; margin: auto; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .btn { display: inline-block; padding: 0.75rem 1.5rem; background: #1351b4; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; }
        .btn-danger { background: #d32f2f; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sandbox django-auth-govbr</h1>
        {% if user.is_authenticated %}
            <p>Bem-vindo, <strong>{{ user.get_full_name|default:user.username }}</strong>!</p>
            <p>CPF (Username): <code>{{ user.username }}</code></p>
            <p>Email: <code>{{ user.email }}</code></p>
            <a href="{% url 'django_govbr_auth:logout' %}" class="btn btn-danger">Sair (Logout Gov.br)</a>
        {% else %}
            <p>Você não está autenticado.</p>
            <a href="{% url 'django_govbr_auth:login' %}" class="btn">Entrar com Gov.br</a>
        {% endif %}
    </div>
</body>
</html>
